name: Bootstrap npm package

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type @danubedata/forgejo-cli@0.1.0 to publish the one-time bootstrap"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    name: Publish @danubedata/forgejo-cli@0.1.0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Confirm exact package and main branch
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "${CONFIRMATION}" = "@danubedata/forgejo-cli@0.1.0"
          test "${GITHUB_REF}" = "refs/heads/main"
          git fetch --no-tags origin main
          test "${GITHUB_SHA}" = "$(git rev-parse origin/main)"

      - name: Install npm publishing runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify source and exact bootstrap version
        run: |
          bun run verify
          package_version="$(node -p 'require("./package.json").version')"
          test "${package_version}" = "0.1.0"

      - name: Verify the bootstrap package is unpublished
        run: |
          error_file="${RUNNER_TEMP}/npm-view-error.log"
          if npm view "@danubedata/forgejo-cli@0.1.0" version 2>"${error_file}"; then
            echo "The bootstrap package version already exists." >&2
            exit 1
          fi
          if ! grep -q "E404" "${error_file}"; then
            echo "npm availability could not be verified safely." >&2
            exit 1
          fi

      - name: Pack, install, and smoke-test the npm artifact
        id: package
        run: |
          package_tarball="$(npm pack --silent | tail -n 1)"
          smoke_root="$(mktemp -d)"
          npm install --prefix "${smoke_root}" --ignore-scripts "${GITHUB_WORKSPACE}/${package_tarball}"
          bun run smoke:artifact -- "${smoke_root}/node_modules/.bin/forgejo"
          printf 'tarball=%s\n' "${package_tarball}" >> "${GITHUB_OUTPUT}"

      - name: Publish the one-time bootstrap package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "${NODE_AUTH_TOKEN}"
          npm publish "${{ steps.package.outputs.tarball }}" --access public --provenance --ignore-scripts
