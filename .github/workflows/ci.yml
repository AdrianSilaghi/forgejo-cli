name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install npm packaging runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run quality and security gates
        run: bun run verify

      - name: Compile and smoke-test the native binary
        run: |
          bun run build:binary
          bun run smoke:artifact -- ./artifacts/forgejo > artifacts/native-contract.json

      - name: Pack, install, and compare the npm artifact
        run: |
          package_tarball="$(npm pack --silent | tail -n 1)"
          smoke_root="$(mktemp -d)"
          npm install --prefix "${smoke_root}" --ignore-scripts "${GITHUB_WORKSPACE}/${package_tarball}"
          bun run smoke:artifact -- "${smoke_root}/node_modules/.bin/forgejo" > artifacts/npm-contract.json
          diff -u artifacts/native-contract.json artifacts/npm-contract.json
