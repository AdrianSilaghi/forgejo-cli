name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify trusted signed tag on main
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "${RELEASE_SIGNING_PUBLIC_KEY}"
          printf '%s' "${RELEASE_SIGNING_PUBLIC_KEY}" | gpg --batch --import
          git verify-tag "${GITHUB_REF_NAME}"
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify source
        run: bun run verify

      - name: Match tag, package, and CLI versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p 'require("./package.json").version')"
          cli_version="$(
            bun src/bin/forgejo.ts --version |
              node -e '
                let source = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { source += chunk; });
                process.stdin.on("end", () => {
                  const result = JSON.parse(source);
                  if (result?.ok !== true || typeof result?.data?.version !== "string") process.exit(1);
                  process.stdout.write(result.data.version);
                });
              '
          )"
          test "${tag_version}" = "${package_version}"
          test "${cli_version}" = "${package_version}"

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: bun-linux-x64-baseline
            name: forgejo-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            name: forgejo-linux-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            name: forgejo-darwin-x64
          - os: macos-15
            target: bun-darwin-arm64
            name: forgejo-darwin-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Compile native binary
        run: >-
          bun build src/bin/forgejo.ts
          --compile
          --target=${{ matrix.target }}
          --no-compile-autoload-dotenv
          --no-compile-autoload-bunfig
          --outfile=artifacts/${{ matrix.name }}

      - name: Smoke-test native binary
        run: bun run smoke:artifact -- ./artifacts/${{ matrix.name }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/${{ matrix.name }}.spdx.json
          upload-artifact: false

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/${{ matrix.name }}

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: artifacts/${{ matrix.name }}
          sbom-path: artifacts/${{ matrix.name }}.spdx.json

      - name: Upload release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: artifacts/${{ matrix.name }}*
          if-no-files-found: error

  stage-release:
    name: Stage draft GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum forgejo-* > SHA256SUMS

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            test "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = true
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber release-assets/*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --draft \
              release-assets/*
          fi

  publish-npm:
    name: Publish npm package
    needs: stage-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install npm trusted-publishing runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Verify npm trusted-publishing runtime
        run: |
          npm_version="$(npm --version)"
          node --version
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const compatible = major > 11 ||
              (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!compatible) throw new Error("npm " + process.argv[1] + " is below trusted-publishing minimum 11.5.1");
          ' "${npm_version}"

      - name: Verify trusted signed tag on main
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "${RELEASE_SIGNING_PUBLIC_KEY}"
          printf '%s' "${RELEASE_SIGNING_PUBLIC_KEY}" | gpg --batch --import
          git verify-tag "${GITHUB_REF_NAME}"
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag and package versions match
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"

      - name: Pack, install, and smoke-test npm artifact
        id: package
        run: |
          package_tarball="$(npm pack --silent | tail -n 1)"
          smoke_root="$(mktemp -d)"
          npm install --prefix "${smoke_root}" --ignore-scripts "${GITHUB_WORKSPACE}/${package_tarball}"
          bun run smoke:artifact -- "${smoke_root}/node_modules/.bin/forgejo"
          printf 'tarball=%s\n' "${package_tarball}" >> "${GITHUB_OUTPUT}"

      - name: Publish through npm trusted publishing
        run: npm publish "${{ steps.package.outputs.tarball }}" --access public --provenance --ignore-scripts

  publish:
    name: Finalize GitHub release
    needs: publish-npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the staged immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --draft=false
